name: Deploy Lululemon deals to GitHub Pages

# Hybrid setup (2026-11-24): data is scraped by Muse, not by this
# workflow. GitHub Actions runner IPs are blocked/timed-out by
# lululemon/Akamai (run #1: HTTP/2 error; run #2: 90s timeouts on both
# gender pages, 0 deals), while Muse's browser loads the site fine.
# Muse pushes data/deals.json + data/top10.json; this workflow only
# copies them into site/ and deploys Pages.
on:
  push:
    branches: [main]
    paths:
      - "data/*.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Copy data into site
        run: |
          cp data/deals.json site/deals.json
          cp data/top10.json site/top10.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
